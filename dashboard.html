
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SheSeed Studio | Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard {
      max-width: 1100px;
      margin: 50px auto;
      padding: 30px;
    }

    .dashboard-header {
      margin-bottom: 40px;
    }

    .dashboard-header h1 {
      font-size: 2.5rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .dashboard-card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    .dashboard-card h2 {
      margin-top: 0;
    }

    .dashboard input,
    .dashboard textarea,
    .dashboard select {
      width: 100%;
      padding: 13px;
      margin: 10px 0 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font: inherit;
    }

    .dashboard textarea {
      min-height: 100px;
    }

    .generate-button {
      background: #c2185b;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .result {
      margin-top: 25px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .result-section {
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
</head>

<body>
  <section id="loginScreen" class="dashboard">
  <div class="dashboard-card">
    <h1>SheSeed Studio</h1>
    <p>Your private creative workspace</p>

    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="Your email">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Your password">

    <button class="generate-button" id="loginButton">
      Log in
    </button>

    <p id="loginStatus" role="status"></p>
  </div>
</section>
  <main class="dashboard" id="dashboardApp" hidden>
    <header class="dashboard-header">
      <p>YOUR CREATIVE WORKSPACE</p>
      <h1>SheSeed Studio</h1>
      <p>Turn your fashion ideas into Pinterest-ready content.</p>
    </header>

    <div class="dashboard-grid">
      <section class="dashboard-card">
        <h2>AI Content Generator</h2>

        <label for="topic">What would you like to create?</label>
        <input
          id="topic"
          type="text"
          placeholder="e.g. Elegant autumn outfits"
        >

        <label for="style">Visual style</label>
        <select id="style">
          <option>Elegant, feminine, Mediterranean, old money</option>
          <option>Minimalist and sophisticated</option>
          <option>Romantic and feminine</option>
          <option>Casual chic and effortless</option>
        </select>

        <label for="audience">Target audience</label>
        <input
          id="audience"
          type="text"
          value="Women interested in elegant fashion"
        >

        <button class="generate-button" id="generateButton">
          Generate Pinterest Content
        </button>

        <div id="status" role="status"></div>
      </section>

      <section class="dashboard-card">
        <h2>Your Generated Content</h2>
        <div id="result" class="result">
          Your generated Pinterest content will appear here.
        </div>
      </section>
    </div>
  </main>
  
<script>
  const SUPABASE_URL = "https://ttosxehifynvimjdvpjn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_nNTt_u4o_ARqeb16c9hGQQ_jwEA7Uv0";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const loginScreen = document.getElementById("loginScreen");
  const dashboardApp = document.getElementById("dashboardApp");
  const loginStatus = document.getElementById("loginStatus");

  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
      loginScreen.hidden = true;
      dashboardApp.hidden = false;
    } else {
      loginScreen.hidden = false;
      dashboardApp.hidden = true;
    }
  }

  document.getElementById("loginButton").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginStatus.textContent = "Logging in...";

    const { error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      loginStatus.textContent = error.message;
      return;
    }

    loginStatus.textContent = "";
    await checkSession();
  });

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (session) {
      loginScreen.hidden = true;
      dashboardApp.hidden = false;
    } else {
      loginScreen.hidden = false;
      dashboardApp.hidden = true;
    }
  });

  checkSession();
</script>

<script>
  const generateButton = document.getElementById("generateButton");
  const resultBox = document.getElementById("result");
  const statusBox = document.getElementById("status");

  generateButton.addEventListener("click", async () => {
    const topic = document.getElementById("topic").value.trim();
    const style = document.getElementById("style").value;
    const audience = document.getElementById("audience").value.trim();

    if (!topic) {
      statusBox.textContent = "Please enter a topic first.";
      return;
    }

    generateButton.disabled = true;
    statusBox.textContent = "Creating your Pinterest content...";
    resultBox.textContent = "";

    try {
      const { data, error } = await supabaseClient.functions.invoke(
        "generate-pin-content",
        {
          body: { topic, style, audience }
        }
      );

      if (error) throw error;
      if (!data || !data.success) {
        throw new Error(data?.error || "Generation failed.");
      }

      const content = data.content;

      resultBox.replaceChildren();

      const sections = [
        ["Title", content.title],
        ["Description", content.description],
        ["Keywords", (content.keywords || []).join(", ")],
        ["Image prompt", content.image_prompt]
      ];

      sections.forEach(([heading, value]) => {
        const section = document.createElement("div");
        section.className = "result-section";

        const title = document.createElement("h3");
        title.textContent = heading;

        const text = document.createElement("p");
        text.textContent = value || "";

        section.append(title, text);
        resultBox.appendChild(section);
      });

      statusBox.textContent = "Your content was generated and saved!";
    } catch (error) {
      console.error(error);
      statusBox.textContent =
        error.message || "Something went wrong. Please try again.";
    } finally {
      generateButton.disabled = false;
    }
  });
</script>

</body>
</html>
